[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tryaii-router-h4"
# The payload's own version. It changes only when the files change (a new
# payload sha256, pinned in tryaii.embeddings.model_store); tryaii pins it exactly.
version = "1.0.0"
description = "The prompt router of the tryaii SDK: H4, a Hebrew + English static embedding model with a classification head (numpy only, no PyTorch)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "TryAII Team", email = "ceo@tryaii.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/Tryaii-Admin/tryaii"
Repository = "https://github.com/Tryaii-Admin/tryaii"

[tool.hatch.build.targets.wheel]
packages = ["tryaii_router_h4"]

[tool.hatch.build.targets.sdist]
include = ["tryaii_router_h4", "README.md", "pyproject.toml"]
