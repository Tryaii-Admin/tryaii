[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tryaii-minilm-int8"
# The model file's own version. It changes only when the weights change (a new
# sha256, pinned in tryaii.embeddings.model_store); tryaii pins it exactly.
version = "1.0.0"
description = "The embedding model of the tryaii SDK: all-MiniLM-L6-v2 as an int8 ONNX file (no PyTorch)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "TryAII Team", email = "ceo@tryaii.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/Tryaii-Admin/tryaii"
Repository = "https://github.com/Tryaii-Admin/tryaii"

[tool.hatch.build.targets.wheel]
packages = ["tryaii_minilm_int8"]

[tool.hatch.build.targets.sdist]
include = ["tryaii_minilm_int8", "README.md", "pyproject.toml"]
