name: Version check

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  version-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify version agrees across all four spots
        run: python scripts/bump-version.py --check
