name: Release

# Tag-only release pipeline. Pushing a `vX.Y.Z` tag:
#   1. verify          - asserts the tag matches every version spot, builds and
#                        smoke-tests both packages exactly like the CI publish-check jobs
#   2. publish-pypi    - Trusted Publishing (OIDC) to PyPI
#   3. publish-npm     - Trusted Publishing (OIDC) to npm with provenance
#   4. github-release  - GitHub Release with the CHANGELOG section + built artifacts
#
# No workflow_dispatch on purpose: a release must correspond to a tag.
# Both publish jobs run in the `release` environment so that approval rules /
# tag protection on that environment gate every upload.

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  verify:
    name: Verify tag, build and smoke both packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive version from tag
        id: tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$tag' does not look like vX.Y.Z"
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Assert every version spot matches the tag
        env:
          EXPECTED: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          pkg=$(node -p "require('./packages/node/package.json').version")
          lock=$(node -p "require('./packages/node/package-lock.json').version")
          pyproject=$(python3 - <<'PY'
          import re, pathlib
          text = pathlib.Path("packages/python/pyproject.toml").read_text(encoding="utf-8")
          m = re.search(r'^version\s*=\s*"([^"]+)"', text, re.M)
          print(m.group(1) if m else "<missing>")
          PY
          )
          init=$(python3 - <<'PY'
          import re, pathlib
          text = pathlib.Path("packages/python/tryaii/__init__.py").read_text(encoding="utf-8")
          m = re.search(r'^__version__\s*=\s*"([^"]+)"', text, re.M)
          print(m.group(1) if m else "<missing>")
          PY
          )

          ok=1
          echo "Tag version:                              $EXPECTED"
          for entry in \
            "packages/node/package.json|$pkg" \
            "packages/node/package-lock.json (root .version)|$lock" \
            "packages/python/pyproject.toml|$pyproject" \
            "packages/python/tryaii/__init__.py __version__|$init"; do
            file="${entry%%|*}"; found="${entry#*|}"
            if [ "$found" = "$EXPECTED" ]; then
              printf '  OK       %-52s %s\n' "$file" "$found"
            else
              printf '  MISMATCH %-52s %s\n' "$file" "$found"
              echo "::error file=${file%% *}::version '$found' does not match tag v$EXPECTED"
              ok=0
            fi
          done
          if [ "$ok" -ne 1 ]; then
            echo
            echo "Refusing to release: tag v$EXPECTED disagrees with one or more version spots above."
            echo "Bump every spot to $EXPECTED (or re-tag) and push again."
            exit 1
          fi
          echo "All version spots match v$EXPECTED"

      # Catalog contract section 6: a released package must trust production
      # catalog-signing keys only: fails if shared/catalog/trusted_keys.json (or
      # a packaged copy) lists a development key or no production key
      # (see scripts/check-release-keys.py).
      - name: Release guard -- catalog signing keys are production-only
        run: python3 scripts/check-release-keys.py

      # ---------------------------------------------------------------- node
      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install node dependencies
        working-directory: packages/node
        run: npm install

      - name: Build node package
        working-directory: packages/node
        run: npm run build

      - name: "Verify node dist artifacts (release mode: production keys only)"
        working-directory: packages/node
        run: npm run verify:release

      - name: Pack and check node tarball
        working-directory: packages/node
        env:
          EXPECTED: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          npm pack
          tarball="tryaii-${EXPECTED}.tgz"
          test -f "$tarball" || { echo "::error::expected $tarball, got: $(ls *.tgz)"; exit 1; }
          tar tzf "$tarball" | head -20
          echo "Pack succeeded: $tarball"

      - name: Upload node tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-tarball
          path: packages/node/tryaii-*.tgz
          if-no-files-found: error
          retention-days: 7

      # -------------------------------------------------------------- python
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install python build tools
        run: pip install build twine

      - name: Build sdist and wheel
        working-directory: packages/python
        run: python -m build

      - name: Validate distributions
        working-directory: packages/python
        run: twine check dist/*

      - name: Smoke test -- install wheel in clean env
        working-directory: packages/python
        run: |
          python -m venv /tmp/smoke-env
          /tmp/smoke-env/bin/pip install dist/*.whl
          /tmp/smoke-env/bin/tryaii --help >/dev/null
          /tmp/smoke-env/bin/python - <<'PY'
          import numpy as np
          import sentence_transformers

          class FakeSentenceTransformer:
              def __init__(self, model_name: str, device=None):
                  self.model_name = model_name
                  self.device = device

              def encode(
                  self,
                  texts,
                  convert_to_numpy=True,
                  normalize_embeddings=False,
                  batch_size=32,
              ):
                  if isinstance(texts, str):
                      texts = [texts]

                  vectors = []
                  for text in texts:
                      seed = abs(hash(text)) % (2**32)
                      rng = np.random.RandomState(seed)
                      vector = rng.randn(384).astype(np.float32)
                      if normalize_embeddings:
                          vector /= np.linalg.norm(vector)
                      vectors.append(vector)

                  return np.stack(vectors)

          sentence_transformers.SentenceTransformer = FakeSentenceTransformer

          from tryaii import Router

          router = Router()
          result = router.route("Write a Python function to merge sorted arrays")
          assert result.best_model, "No model returned"
          print(f"Smoke test passed: best_model={result.best_model}")
          PY

      - name: Smoke test -- cachelint (heuristic path WITHOUT tiktoken, then exact path)
        run: |
          /tmp/smoke-env/bin/tryaii help cachelint >/dev/null
          # Heuristic providers must work without the cachelint extra installed.
          printf '{"prompt": "Smoke prompt.", "llm": {"provider": "anthropic", "name": "claude-fable-5"}}' > /tmp/cachelint-smoke.json
          /tmp/smoke-env/bin/tryaii cachelint /tmp/cachelint-smoke.json --no-banner >/dev/null
          # OpenAI paths require the extra; install it and run the exact tokenizer.
          /tmp/smoke-env/bin/pip install tiktoken >/dev/null
          printf 'A raw prompt for the exact tokenizer path.' | /tmp/smoke-env/bin/tryaii cachelint - --provider openai --model gpt-5.2 --no-banner >/dev/null
          echo "cachelint smoke passed"

      - name: Upload python dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: packages/python/dist/
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    name: Publish to PyPI
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/tryaii/${{ needs.verify.outputs.version }}/
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download python dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          print-hash: true

  publish-npm:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://www.npmjs.com/package/tryaii/v/${{ needs.verify.outputs.version }}
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: packages/node

    steps:
      # The publish runs from the checked-out source, exactly like a local `npm publish`,
      # so that `prepack` (build + verify:dist) re-runs from the tagged tree and the
      # provenance attestation points at this repository and commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # npm >= 11.5.1 is required for OIDC trusted publishing.
      - name: Upgrade npm
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: npm install

      - name: Publish to npm (Trusted Publishing, with provenance)
        run: npm publish --provenance --access public

  github-release:
    name: Create GitHub Release
    needs: [verify, publish-pypi, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download node tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: node-tarball
          path: release-assets/

      - name: Download python dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: release-assets/

      - name: Extract CHANGELOG section
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          # Headings look like `## 0.5.1 (2026-09-17)`; take everything from the
          # matching heading (exclusive) up to the next `## ` heading.
          awk -v ver="$VERSION" '
            /^## / {
              if (found) exit
              if ($2 == ver) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          # Trim leading/trailing blank lines.
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("release-notes.md")
          body = p.read_text(encoding="utf-8").strip()
          p.write_text(body + "\n" if body else "", encoding="utf-8")
          PY
          if [ ! -s release-notes.md ]; then
            echo "::warning::No '## $VERSION' section found in CHANGELOG.md; using a fallback body."
            echo "Release v$VERSION of tryaii (npm + PyPI). See CHANGELOG.md for details." > release-notes.md
          fi
          echo "----- release notes -----"
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          ls -la release-assets/
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "v$VERSION" \
            --notes-file release-notes.md \
            --verify-tag \
            release-assets/*
