name: Node CI

# Production (public release) repo: the FULL check (Node 18/20/22, full suite, publish-check) runs on every
# pull request into main and on manual runs, and on nothing else: no push
# runs on any branch (main only changes through reviewed PRs, and a release
# tag is verified by release.yml itself). A newer push to the same PR
# cancels the running check.
#
# tryaii-dev carries a mode-aware copy of this file (light there, full here,
# decided by github.repository), so a release that copies the dev tree
# across keeps this repo on the full matrix.

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/node/**"
      - "shared/**"
      - ".github/workflows/node-ci.yml"
      # Prose-only changes run nothing...
      - "!**/*.md"
      # ...except the Markdown that tests read.
      - "shared/*/skill/**"
      - "shared/*/fixtures/**"
      - "docs/auth/CONTRACT-*.md"
      - "docs/catalog/CONTRACT-*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    defaults:
      run:
        working-directory: packages/node

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npx tsc --noEmit

      # The CLI black-box suites (auth/catalog contract) spawn dist/cli.js.
      - name: Build
        run: npm run build

      - name: Run tests
        run: npx vitest run

  publish-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/node

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify dist artifacts
        run: npm run verify:dist

      - name: Pack and check tarball
        run: |
          npm pack
          tar tzf tryaii-*.tgz | head -20
          echo "Pack succeeded"
